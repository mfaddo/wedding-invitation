<section class="hero">
  <!-- Video Background -->
  <video class="hero__video" autoplay muted loop playsinline>
    <source src="/assets/videos/swans.mp4" type="video/mp4">
  </video>

  <!-- Left Flowers -->
  <div class="hero__flowers hero__flowers--left">
    <svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
      <!-- Floral arrangement on the left -->
      <g class="flower-cluster">
        <!-- Pink peony petals -->
        <circle cx="150" cy="200" r="45" fill="#e8b4d4" opacity="0.9"/>
        <circle cx="120" cy="170" r="40" fill="#f0c4e0" opacity="0.85"/>
        <circle cx="180" cy="170" r="38" fill="#f0c4e0" opacity="0.85"/>
        <circle cx="110" cy="210" r="35" fill="#e8b4d4" opacity="0.8"/>
        <circle cx="190" cy="210" r="35" fill="#e8b4d4" opacity="0.8"/>
        <circle cx="150" cy="240" r="40" fill="#f0c4e0" opacity="0.9"/>
        <circle cx="150" cy="150" r="38" fill="#f5d9ec" opacity="0.85"/>

        <!-- Yellow flower center -->
        <circle cx="150" cy="200" r="20" fill="#f4d03f"/>
        <circle cx="150" cy="200" r="12" fill="#f9e79f"/>

        <!-- Cream colored flowers scattered -->
        <circle cx="100" cy="120" r="28" fill="#fef5e7" opacity="0.9"/>
        <circle cx="200" cy="130" r="26" fill="#fef5e7" opacity="0.9"/>
        <circle cx="80" cy="260" r="24" fill="#fef5e7" opacity="0.85"/>
        <circle cx="220" cy="280" r="25" fill="#fef5e7" opacity="0.85"/>

        <!-- Green leaves -->
        <ellipse cx="60" cy="180" rx="15" ry="35" fill="#8ba888" opacity="0.7" transform="rotate(-30 60 180)"/>
        <ellipse cx="240" cy="200" rx="15" ry="35" fill="#8ba888" opacity="0.7" transform="rotate(30 240 200)"/>
        <ellipse cx="90" cy="290" rx="12" ry="40" fill="#9db996" opacity="0.6" transform="rotate(-45 90 290)"/>
        <ellipse cx="210" cy="310" rx="12" ry="40" fill="#9db996" opacity="0.6" transform="rotate(45 210 310)"/>

        <!-- Delicate stems -->
        <line x1="150" y1="250" x2="70" y2="340" stroke="#a8b89f" stroke-width="2" opacity="0.6"/>
        <line x1="150" y1="250" x2="230" y2="350" stroke="#a8b89f" stroke-width="2" opacity="0.6"/>
      </g>
    </svg>
  </div>

  <!-- Right Flowers -->
  <div class="hero__flowers hero__flowers--right">
    <svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
      <!-- Floral arrangement on the right -->
      <g class="flower-cluster">
        <!-- Pink peony petals -->
        <circle cx="150" cy="200" r="45" fill="#e8b4d4" opacity="0.9"/>
        <circle cx="120" cy="170" r="40" fill="#f0c4e0" opacity="0.85"/>
        <circle cx="180" cy="170" r="38" fill="#f0c4e0" opacity="0.85"/>
        <circle cx="110" cy="210" r="35" fill="#e8b4d4" opacity="0.8"/>
        <circle cx="190" cy="210" r="35" fill="#e8b4d4" opacity="0.8"/>
        <circle cx="150" cy="240" r="40" fill="#f0c4e0" opacity="0.9"/>
        <circle cx="150" cy="150" r="38" fill="#f5d9ec" opacity="0.85"/>

        <!-- Yellow flower center -->
        <circle cx="150" cy="200" r="20" fill="#f4d03f"/>
        <circle cx="150" cy="200" r="12" fill="#f9e79f"/>

        <!-- Cream colored flowers scattered -->
        <circle cx="100" cy="120" r="28" fill="#fef5e7" opacity="0.9"/>
        <circle cx="200" cy="130" r="26" fill="#fef5e7" opacity="0.9"/>
        <circle cx="80" cy="260" r="24" fill="#fef5e7" opacity="0.85"/>
        <circle cx="220" cy="280" r="25" fill="#fef5e7" opacity="0.85"/>

        <!-- Green leaves -->
        <ellipse cx="60" cy="180" rx="15" ry="35" fill="#8ba888" opacity="0.7" transform="rotate(-30 60 180)"/>
        <ellipse cx="240" cy="200" rx="15" ry="35" fill="#8ba888" opacity="0.7" transform="rotate(30 240 200)"/>
        <ellipse cx="90" cy="290" rx="12" ry="40" fill="#9db996" opacity="0.6" transform="rotate(-45 90 290)"/>
        <ellipse cx="210" cy="310" rx="12" ry="40" fill="#9db996" opacity="0.6" transform="rotate(45 210 310)"/>

        <!-- Delicate stems -->
        <line x1="150" y1="250" x2="70" y2="340" stroke="#a8b89f" stroke-width="2" opacity="0.6"/>
        <line x1="150" y1="250" x2="230" y2="350" stroke="#a8b89f" stroke-width="2" opacity="0.6"/>
      </g>
    </svg>
  </div>

  <!-- Ornate Arch Frame -->
  <div class="hero__arch">
    <div class="arch__corner arch__corner--top-left"></div>
    <div class="arch__corner arch__corner--top-right"></div>
    <div class="arch__corner arch__corner--bottom-left"></div>
    <div class="arch__corner arch__corner--bottom-right"></div>
    <div class="arch__top"></div>
    <div class="arch__bottom"></div>
  </div>

  <!-- Content Container -->
  <div class="hero__content">
    <!-- Wedding Day Label and Date -->
    <div class="hero__top-section">
      <div class="hero__label">{{ lang.t().weddingDay }}</div>
      <div class="hero__top-date">{{ lang.t().dateLine }}</div>
    </div>

    <!-- Names - Main Focus -->
    <div class="hero__names-container">
      <h1
        class="hero__names"
        [style.fontFamily]="lang.fontHeading()"
        [style.fontStyle]="lang.headingStyle()"
      >
        {{ lang.t().coupleNames }}
      </h1>
      <div class="hero__names-divider"></div>
    </div>

    <!-- Additional Details (shown on scroll or hover) -->
    <div class="hero__details">
      <div class="hero__time">{{ lang.t().time }}</div>
      <div class="hero__venue">{{ lang.t().venue }}</div>
      <div class="hero__address">{{ lang.t().address }}</div>
      <a class="hero__map-btn" [href]="mapHref()" target="_blank" rel="noopener">{{ lang.t().mapBtn }}</a>
    </div>

    <!-- Scroll Down Indicator -->
    <div class="hero__scroll-indicator">
      <span class="scroll-text">{{ lang.t().scrollDown }}</span>
      <svg class="scroll-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 10l5 5 5-5z" fill="currentColor"/>
      </svg>
    </div>
  </div>
</section>
