<section class="hero">
  <!-- Video Background -->
  <video class="hero__video" muted loop playsinline>
    <source src="assets/videos/swans.mp4" type="video/mp4">
  </video>

  <!-- Left Flowers -->
  <div class="hero__flowers hero__flowers--left">
    <img src="assets/images/leftFlower.webp" alt="Left Floral Arrangement" />
  </div>

  <!-- Right Flowers -->
  <div class="hero__flowers hero__flowers--right">
    <img src="assets/images/rightFlower.png" alt="Right Floral Arrangement" />
  </div>

  <!-- Content Container -->
  <div class="hero__content">
    <!-- Wedding Day Label and Date -->
    <div class="hero__top-section">
      <div class="hero__label">{{ lang.t().weddingDay }}</div>
      <div class="hero__top-date">{{ lang.t().dateLine }}</div>
    </div>

    <!-- Names - Main Focus -->
    <div class="hero__names-container">
      <h1
        class="hero__names"
        [style.fontFamily]="lang.fontHeading()"
        [style.fontStyle]="lang.headingStyle()"
      >
        {{ lang.t().coupleNames }}
      </h1>
      <div class="hero__names-divider"></div>
    </div>

    <!-- Additional Details (shown on scroll or hover) -->
    <div class="hero__details">
      <div class="hero__time">{{ lang.t().time }}</div>
      <div class="hero__venue">{{ lang.t().venue }}</div>
      <div class="hero__address">{{ lang.t().address }}</div>
      <a class="hero__map-btn" [href]="mapHref()" target="_blank" rel="noopener">{{ lang.t().mapBtn }}</a>
    </div>

    <!-- Scroll Down Indicator -->
    <div class="hero__scroll-indicator">
      <span class="scroll-text">{{ lang.t().scrollDown }}</span>
      <svg class="scroll-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 10l5 5 5-5z" fill="currentColor"/>
      </svg>
    </div>
  </div>
</section>
