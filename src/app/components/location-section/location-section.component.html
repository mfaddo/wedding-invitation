<section class="location">
  <svg
    class="location__icon"
    [class.location__icon--rtl]="lang.isRtl()"
    viewBox="0 0 24 24"
    width="80"
    height="80"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    aria-hidden="true"
  >
    <path d="M12 2C7.58 2 4 5.58 4 10c0 5.25 8 13 8 13s8-7.75 8-13c0-4.42-3.58-8-8-8zm0 11c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z" />
  </svg>

  <div
    class="location__title"
    [style.fontFamily]="lang.fontHeading()"
    [style.fontStyle]="lang.headingStyle()"
  >
    {{ lang.t().location }}
  </div>

  <div class="location__venue">{{ lang.t().locationName }}</div>

  <div class="location__address">{{ lang.t().locationAddress }}</div>

  <div class="location__images">
    <div class="location__image-placeholder">
      <img src="assets/images/wedding-plcae-1.jpeg" alt="" />
    </div>
    <div class="location__image-placeholder">
      <img src="assets/images/wedding-plcae-2.jpeg" alt="" />
    </div>
  </div>

  <div class="location__map-container">
    <iframe
      class="location__map"
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3453.482925762839!2d31.3258202!3d30.051688899999995!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14583fd0e6d180f3%3A0x9c41f83c0dc4f82f!2z2YLYp9i52KfYqiDZgti12LEg2KfZhNin2YXZitix2KfYqiDZhNmE2K3ZgdmE2KfYqg!5e0!3m2!1sen!2sde!4v1785253689480!5m2!1sen!2sde"
      width="100%"
      height="400"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>

  <a
    href="https://www.google.com/maps/place/%D9%82%D8%A7%D8%B9%D8%A7%D8%AA+%D9%82%D8%B5%D8%B1+%D8%A7%D9%84%D8%A7%D9%85%D9%8A%D8%B1%D8%A7%D8%AA+%D9%84%D9%84%D8%AD%D9%81%D9%84%D8%A7%D8%AA%E2%80%AD/@30.0516889,31.3232453,17z/data=!3m1!4b1!4m6!3m5!1s0x14583fd0e6d180f3:0x9c41f83c0dc4f82f!8m2!3d30.0516889!4d31.3258202!16s%2Fg%2F11s_xs54ph?hl=en&entry=ttu&g_ep=EgoyMDI2MDcyMi4wIKXMDSoASAFQAw%3D%3D"
    target="_blank"
    rel="noopener noreferrer"
    class="location__map-btn"
  >
    {{ lang.t().mapBtn }}
  </a>
</section>
